  <div class="panel"><h2>New email</h2>
    <p class="lead">Email one person. Members by account number or email; anyone else by email. It is kept on their thread so replies come back here.</p>
    <label>To</label><input id="mcTo" placeholder="IW1234 or name@example.com" autocomplete="off">
    <label>Subject</label><input id="mcSub" placeholder="About your account">
    <label>Message</label><textarea id="mcBody" rows="6"></textarea>
    <div style="display:flex;gap:8px;align-items:center;margin-top:8px"><button class="btn lime" id="mcGo" style="margin:0">Send email</button></div>
    <div class="err" id="mcErr"></div>
  </div>
