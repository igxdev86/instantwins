<!-- InstantWins promo modal — paste once before </body>. Self-contained. Shows once per visitor per IW_DAYS; IW_REF tags the sign-up. -->
<script>
(function(){
  var IW_REF='bettingsites', IW_DAYS=7, IW_DELAY=2500, KEY='iw_promo_seen', H='https://instantwins.co.uk';
  try{ var seen=+localStorage.getItem(KEY)||0; if(Date.now()-seen<IW_DAYS*864e5)return; }catch(e){}
  // SEO: never interrupt a visitor who has just landed from a search engine (Google's intrusive-interstitial rule).
  // Show on their second page of the visit, or once they have scrolled a screen's worth on this one.
  var fromSearch=/google\.|bing\.|duckduckgo\.|yahoo\.|ecosia\./i.test(document.referrer||''); var second=false;
  try{ second=sessionStorage.getItem('iw_pv')==='1'; sessionStorage.setItem('iw_pv','1'); }catch(e){}
  var armed=!fromSearch||second;
  var F='-apple-system,"Inter","Segoe UI",Helvetica,Arial,sans-serif';
  var css=''
   +'#iwPromo{position:fixed;inset:0;z-index:2147483000;background:rgba(4,4,9,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:14px;font-family:'+F+';animation:iwFade .25s ease-out;-webkit-font-smoothing:antialiased}'
   +'@keyframes iwFade{from{opacity:0}to{opacity:1}}@keyframes iwUp{from{transform:translateY(16px) scale(.98);opacity:0}to{transform:none;opacity:1}}@keyframes iwShine{0%{transform:translateX(-120%) skewX(-18deg)}60%,100%{transform:translateX(220%) skewX(-18deg)}}'
   +'#iwPromo .iwBox{position:relative;width:100%;max-width:392px;border-radius:26px;padding:1px;background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,.06) 40%,rgba(198,255,61,.25));box-shadow:0 40px 90px rgba(0,0,0,.7);animation:iwUp .35s cubic-bezier(.2,.8,.2,1);max-height:calc(100vh - 28px);max-height:calc(100dvh - 28px);display:flex}'
   +'#iwPromo .iwIn{position:relative;overflow:auto;-webkit-overflow-scrolling:touch;width:100%;border-radius:25px;background:radial-gradient(120% 70% at 50% -10%,rgba(61,242,255,.16),transparent 55%),radial-gradient(90% 60% at 100% 100%,rgba(255,106,26,.16),transparent 60%),linear-gradient(180deg,#1b1b25 0%,#111118 55%,#0b0b10 100%);color:#fff;text-align:center}'
   +'#iwPromo .iwIn:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,0) 30%);pointer-events:none}'
   +'#iwPromo .iwHd{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 0 18px}'
   +'#iwPromo .iwLogo{height:30px;width:auto;display:block}'
   +'#iwPromo .iwX{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font-size:20px;line-height:32px;cursor:pointer;padding:0}'
   +'#iwPromo .iwK{margin:10px 0 4px;font-weight:800;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#3DF2FF}'
   +'#iwPromo h3{margin:0 18px 10px;font-weight:900;font-size:26px;line-height:1.05;letter-spacing:-.03em}#iwPromo h3 b{display:inline;color:#FF6A1A;font-weight:900}'
   +'#iwPromo .iwScreen{position:relative;margin:0 16px;border-radius:18px;padding:1px;background:linear-gradient(180deg,rgba(61,242,255,.55),rgba(61,242,255,.08));box-shadow:0 18px 40px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.4) inset}'
   +'#iwPromo .iwScreen>div{position:relative;overflow:hidden;border-radius:17px;background:#0b0b10}'
   +'#iwPromo video,#iwPromo img.iwGif{display:block;width:100%;height:auto}'
   +'#iwPromo .iwDemo{position:absolute;left:10px;top:10px;background:linear-gradient(90deg,#FF3D8A,#FF6A1A);color:#1A0A00;font-weight:900;font-size:10px;letter-spacing:.14em;padding:4px 9px;border-radius:999px}'
   +'#iwPromo .iwStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 16px 0}'
   +'#iwPromo .iwStats div{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px 4px 9px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}'
   +'#iwPromo .iwStats b{display:block;font-weight:900;font-size:17px;letter-spacing:-.02em;color:#C6FF3D}#iwPromo .iwStats span{display:block;font-size:10.5px;color:#9aa0ad;margin-top:3px;letter-spacing:.02em}'
   +'#iwPromo p{margin:10px 22px 12px;font-size:13px;line-height:1.45;color:#b9bcc8}'
   +'#iwPromo .iwGo{position:relative;overflow:hidden;display:block;margin:0 16px;padding:16px 20px;border-radius:999px;background:linear-gradient(135deg,#f4ffb0,#C6FF3D 45%,#9fd81c);color:#0B0B10;font-weight:900;font-size:18px;text-decoration:none;box-shadow:0 12px 34px rgba(198,255,61,.38),inset 0 1px 0 rgba(255,255,255,.7)}'
   +'#iwPromo .iwGo i{position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));animation:iwShine 2.8s ease-in-out infinite}'
   +'#iwPromo .iwFree{display:block;margin:10px 16px 0;font-size:12.5px;color:#3DF2FF;text-decoration:none;font-weight:700}'
   +'#iwPromo .iwLegal{margin:10px 18px 0;padding:9px 0 12px;border-top:1px solid rgba(255,255,255,.08);font-size:10.5px;line-height:1.5;color:#7c8190}#iwPromo .iwLegal a{color:#9aa0ad}'
   +'#iwPromo .iwNo{display:block;padding:0 0 12px;background:none;border:0;color:#7c8190;font-size:12px;cursor:pointer;width:100%;font-family:inherit}'
   +'@media(max-width:360px){#iwPromo h3{font-size:26px}}';
  var st=document.createElement('style'); st.textContent=css; document.head.appendChild(st);
  var d=document.createElement('div'); d.id='iwPromo'; d.setAttribute('role','dialog'); d.setAttribute('aria-label','InstantWins');
  d.innerHTML='<div class="iwBox"><div class="iwIn">'
   +'<div class="iwHd"><img class="iwLogo" src="'+H+'/mail/logo.png" alt="InstantWins" width="129" height="30"><button class="iwX" aria-label="Close">&times;</button></div>'
   +'<div class="iwK">New &middot; Instant win tickets</div><h3>&pound;1,185,000 <b>in prizes</b></h3>'
   +'<div class="iwScreen"><div><video autoplay muted loop playsinline poster="'+H+'/promo/reveal-poster.jpg"><source src="'+H+'/promo/reveal-demo.mp4" type="video/mp4"><img class="iwGif" src="'+H+'/promo/reveal-demo.gif" alt="The InstantWins ticket reader"></video><span class="iwDemo">DEMO</span></div></div>'
   +'<div class="iwStats"><div><b>25p</b><span>a ticket</span></div><div><b>1 in 5.7</b><span>tickets win</span></div><div><b>&pound;20,000</b><span>top prize</span></div></div>'
   +'<p>Feed your tickets through the reader and see what\'s on them. Plus a &pound;10,000 End Prize Draw on 31 January.</p>'
   +'<a class="iwGo" href="'+H+'/?ref='+IW_REF+'" target="_blank" rel="sponsored noopener">Play now &rarr;<i></i></a>'
   +'<a class="iwFree" href="'+H+'/free.html" target="_blank" rel="sponsored noopener">No purchase necessary &mdash; enter free by post</a>'
   +'<div class="iwLegal">18+, Great Britain only. Prize competition with a free postal entry route under Schedule 2 of the Gambling Act 2005, operated by IGX Ltd. Prizes are a matter of luck and most tickets win nothing &mdash; please play within your means. <a href="'+H+'/terms.html" target="_blank" rel="sponsored noopener">Terms</a> &middot; <a href="'+H+'/responsible-play.html" target="_blank" rel="sponsored noopener">Responsible play</a></div>'
   +'<button class="iwNo" type="button">Not now</button>'
   +'</div></div>';
  function mark(){ try{ localStorage.setItem(KEY,String(Date.now())); }catch(e){} }
  function close(){ d.remove(); mark(); }
  d.querySelector('.iwX').onclick=close; d.querySelector('.iwNo').onclick=close; d.addEventListener('click',function(e){ if(e.target===d)close(); });
  d.querySelector('.iwGo').addEventListener('click',mark);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&d.parentNode)close(); });
  function show(){ document.body.appendChild(d); }
  function arm(){ if(document.readyState==='complete')setTimeout(show,IW_DELAY); else window.addEventListener('load',function(){ setTimeout(show,IW_DELAY); }); }
  if(armed)arm(); else window.addEventListener('scroll',function onS(){ if(window.scrollY>window.innerHeight*0.9){ window.removeEventListener('scroll',onS); setTimeout(show,600); } },{passive:true});
})();
</script>
