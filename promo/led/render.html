<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c"></canvas>
<script>
const LIME='#C6FF3D',CYAN='#3DF2FF',PINK='#FF3D8A',ORANGE='#FF6A1A',BG='#0B0B10';
const FONT='"Inter Display","Inter",Arial,sans-serif';
const c=document.getElementById('c'),x=c.getContext('2d');
let W=1920,H=96,DUR=10;
function setSize(w,h){W=w;H=h;c.width=w;c.height=h;}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rr(px,py,w,h,r){x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();}
function ticket(px,py,w,h,col,rot,label){x.save();x.translate(px+w/2,py+h/2);x.rotate(rot||0);x.translate(-w/2,-h/2);
  rr(0,0,w,h,h*.2);x.fillStyle=col;x.fill();
  x.fillStyle=BG;x.beginPath();x.arc(0,h/2,h*.17,0,7);x.fill();x.beginPath();x.arc(w,h/2,h*.17,0,7);x.fill();
  x.strokeStyle='rgba(11,11,16,.45)';x.setLineDash([h*.12,h*.1]);x.lineWidth=Math.max(2,h*.06);x.beginPath();x.moveTo(w*.66,h*.15);x.lineTo(w*.66,h*.85);x.stroke();x.setLineDash([]);
  x.fillStyle='rgba(11,11,16,.6)';x.font='900 '+(h*.5)+'px '+FONT;x.textBaseline='middle';x.textAlign='left';x.fillText(label||'£',w*.14,h*.52);
  x.restore();}
function logo(px,py,s){ // bolt badge + wordmark
  const g=x.createLinearGradient(px,py,px+s,py+s);g.addColorStop(0,ORANGE);g.addColorStop(1,PINK);
  rr(px,py,s,s,s*.28);x.fillStyle=g;x.fill();
  x.fillStyle='#fff';x.beginPath();x.moveTo(px+s*.56,py+s*.14);x.lineTo(px+s*.3,py+s*.56);x.lineTo(px+s*.5,py+s*.56);x.lineTo(px+s*.42,py+s*.88);x.lineTo(px+s*.72,py+s*.42);x.lineTo(px+s*.52,py+s*.42);x.closePath();x.fill();
  x.fillStyle='#fff';x.font='900 '+(s*.78)+'px '+FONT;x.textBaseline='middle';x.textAlign='left';x.fillText('INSTANTWINS',px+s*1.25,py+s*.52);
  return px+s*1.25+x.measureText('INSTANTWINS').width;}
function glowText(txt,px,py,size,col,align,weight){x.save();x.font=(weight||900)+' '+size+'px '+FONT;x.textBaseline='middle';x.textAlign=align||'left';x.shadowColor=col;x.shadowBlur=size*.35;x.fillStyle=col;x.fillText(txt,px,py);x.shadowBlur=0;x.fillText(txt,px,py);const w=x.measureText(txt).width;x.restore();return w;}
function bgBase(t){ x.fillStyle=BG;x.fillRect(0,0,W,H);
  const g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,'rgba(61,242,255,.18)');g.addColorStop(.5,'rgba(255,61,138,.10)');g.addColorStop(1,'rgba(198,255,61,.18)');x.fillStyle=g;x.fillRect(0,0,W,H);
  // sweep
  const sx=((t*.13)%1.3-.15)*W; const sg=x.createLinearGradient(sx-W*.12,0,sx+W*.12,0);sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(.5,'rgba(255,255,255,.07)');sg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=sg;x.fillRect(0,0,W,H);
  x.fillStyle='rgba(255,255,255,.06)';x.fillRect(0,0,W,2);}
function tickRain(t,seed,n,alpha){ for(let i=0;i<n;i++){ const r=Math.sin(i*12.9898+seed)*43758.5453, f=r-Math.floor(r); const sp=.6+f*.9; const px=((f*7.3+t*sp*.09)%1.1-.05)*W; const py=H*(.12+((i*37)%70)/100); const cols=[LIME,CYAN,ORANGE,PINK]; x.globalAlpha=alpha; ticket(px,py-H*.14,H*.62,H*.28,cols[i%4],(f-.5)*.5); x.globalAlpha=1; } }
function scene1(t,a){ // 0..1 progress, alpha
  x.globalAlpha=a; tickRain(t,1,10,.28*a);
  const s=H*.62; const lx=W*.03, ly=H*.19; const end=logo(lx,ly,s);
  const p=ease(clamp(t*2.2,0,1)); const tx=W*.36+(1-p)*W*.08;
  x.globalAlpha=a*p; const w1=glowText('£1 MILLION',tx,H*.5,H*.7,LIME,'left'); x.globalAlpha=a*ease(clamp(t*2.2-.35,0,1));
  glowText('IN PRIZES',tx+w1+H*.35,H*.5,H*.5,'#fff','left',800);
  const p2=ease(clamp(t*2.2-.7,0,1)); x.globalAlpha=a*p2; rr(W*.80,H*.2,W*.17,H*.6,H*.3); x.fillStyle=PINK;x.fill(); x.fillStyle='#fff';x.font='900 '+(H*.42)+'px '+FONT;x.textAlign='center';x.textBaseline='middle';x.fillText('TICKETS 25p',W*.885,H*.52);
  x.globalAlpha=1;}
function scene2(t,a){
  x.globalAlpha=a; tickRain(t+3,2,8,.22*a);
  const s=H*.5; logo(W*.03,H*.25,s);
  // reader + ticket sliding in
  const rx=W*.30, rw=W*.16; rr(rx,H*.16,rw,H*.68,H*.16); x.fillStyle='#1b222c';x.fill(); rr(rx+H*.1,H*.62,rw-H*.2,H*.14,H*.07);x.fillStyle='#000';x.fill();
  const tp=ease(clamp(t*1.8,0,1)); const tw=H*.9; if(tp<1){ x.globalAlpha=a*(1-clamp((tp-.8)*5,0,1)); ticket(rx+rw+H*.2-(rw+H*.2+tw)*tp*.75, H*.55, tw, H*.28, LIME, 0, '£'); x.globalAlpha=a; }
  const flash=clamp((t-.6)*5,0,1); if(flash>0){ x.globalAlpha=a*flash; glowText('£500',rx+rw*.5,H*.4,H*.4,LIME,'center'); x.globalAlpha=a; }
  const p=ease(clamp(t*2-.2,0,1)); x.globalAlpha=a*p;
  glowText('BUY · FEED · WIN',W*.49,H*.5,H*.56,'#fff','left');
  x.globalAlpha=a*ease(clamp(t*2-.6,0,1)); rr(W*.80,H*.2,W*.17,H*.6,H*.3); x.fillStyle=CYAN;x.fill(); x.fillStyle=BG;x.font='900 '+(H*.42)+'px '+FONT;x.textAlign='center';x.textBaseline='middle';x.fillText('1 IN 6 WINS',W*.885,H*.52);
  x.globalAlpha=1;}
function scene3(t,a){
  x.globalAlpha=a; tickRain(t+6,3,10,.26*a);
  const p=ease(clamp(t*2,0,1)); x.globalAlpha=a*p;
  const s=H*.66; const end=logo(W*.03,H*.17,s);
  glowText('.co.uk',end+H*.05,H*.52,s*.78,LIME,'left');
  x.globalAlpha=a*ease(clamp(t*2-.4,0,1)); glowText('FREE ENTRY BY POST',W*.50,H*.5,H*.5,'#fff','left',800);
  x.globalAlpha=a*ease(clamp(t*2-.7,0,1)); rr(W*.80,H*.2,W*.17,H*.6,H*.3); x.fillStyle=LIME;x.fill(); x.fillStyle=BG;x.font='900 '+(H*.44)+'px '+FONT;x.textAlign='center';x.textBaseline='middle';x.fillText('PLAY NOW',W*.885,H*.52);
  x.globalAlpha=1;}
function badge18(){ const s=H*.34; rr(W*.955,H*.06,s*1.0,s,s*.2); x.fillStyle='rgba(255,255,255,.12)';x.fill(); x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=2;x.stroke(); x.fillStyle='#fff';x.font='900 '+(s*.62)+'px '+FONT;x.textAlign='center';x.textBaseline='middle';x.fillText('18+',W*.955+s*.5,H*.06+s*.53); }
function draw(t){ t=t%DUR; bgBase(t);
  const seg=[[0,3.4],[3.4,6.8],[6.8,10]]; const X=.35;
  for(let i=0;i<3;i++){ const [a,b]=seg[i]; let tt=t-a; if(i===0 && t>DUR-X) tt=t-DUR; // wrap for crossfade
    if(tt<-X||tt>(b-a)) continue; const local=tt/(b-a); const fadeIn=clamp((tt+X)/X,0,1), fadeOut=clamp(((b-a)-tt)/X,0,1); const al=Math.min(fadeIn,fadeOut);
    [scene1,scene2,scene3][i](Math.max(0,tt),al); }
  badge18(); }
window.setSize=setSize; window.draw=draw;
</script></body></html>
